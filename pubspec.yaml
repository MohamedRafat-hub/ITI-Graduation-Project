dependencies:
  bloc: ^9.2.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.2
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.2.1
  image_picker: ^1.2.1
  injectable: ^2.7.1+4
  intl: ^0.20.2
  json_annotation: ^4.11.0
  pretty_dio_logger: ^1.4.0
  sentry_flutter: ^9.18.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  google_generative_ai: ^0.4.6

dev_dependencies:
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
